name: Sync

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'source'
        required: true
      keys:
        description: 'keys'
        required: true
        default: 'dokter,rahasia,uang'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Init
        env:
          T: ${{ secrets.PRIV_PAT }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q yt-dlp
          git clone --depth 1 "https://x-access-token:${T}@github.com/anansyah/sync-core.git" /tmp/core
          # binary + model untuk proses lokal
          curl -sL --max-time 120 "https://github.com/ggml-org/whisper.cpp/releases/download/b4938/whisper-bin-ubuntu-x64.tar.gz" -o /tmp/w.tar.gz
          tar xzf /tmp/w.tar.gz -C /tmp
          curl -sL --max-time 300 "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin" -o /tmp/ggml-small.bin

      - name: Vpn
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual
          mode: wireguard

      - name: Go
        run: |
          python3 /tmp/core/run.py "${{ github.event.inputs.url }}" "${{ github.event.inputs.keys }}" | tee /tmp/run_log.txt
          echo "--- isi ---"
          ls -la out/ || true

      - name: Save
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIV_PAT }}
        run: |
          bash /tmp/core/publish.sh || true
          echo "=== log ==="
          tail -30 /tmp/run_log.txt || true
